services:
  db:
    image: mariadb:11
    container_name: attendance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-attendance_db}
      MYSQL_USER: ${MYSQL_USER:-attendance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-attendance_pass}
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - attendance_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-attendance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-attendance_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-attendance_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      FLASK_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - qr_data:/app/frontend/static/images/qrcodes
    networks:
      - attendance_network

  apache:
    image: httpd:2.4
    container_name: attendance_apache
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9090:80"
    volumes:
      - ./apache/proxy.conf:/usr/local/apache2/conf/extra/proxy.conf:ro
    command: >
      sh -c "
      sed -i 's/#LoadModule proxy_module/LoadModule proxy_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/#LoadModule proxy_http_module/LoadModule proxy_http_module/' /usr/local/apache2/conf/httpd.conf &&
      echo 'Include conf/extra/proxy.conf' >> /usr/local/apache2/conf/httpd.conf &&
      httpd-foreground
      "
    networks:
      - attendance_network

volumes:
  db_data:
  qr_data:

networks:
  attendance_network:
    driver: bridge
