{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Add Student</h5>
      </div>
      <div class="card-body">
        <form method="post" action="/students">
          <div class="mb-3">
            <label for="name" class="form-label">Student Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="year_level" class="form-label">Year Level</label>
            <input type="text" class="form-control" id="year_level" name="year_level">
          </div>
          <div class="mb-3">
            <label for="course_id" class="form-label">Course</label>
            <select class="form-select" id="course_id" name="course_id" required>
              <option value="">Select a course</option>
              {% for course in courses %}
              <option value="{{ course.id }}">{{ course.name }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Create Student</button>
        </form>
        <div class="mt-3">
          <a href="/students/upload-csv" class="btn btn-outline-info btn-sm">Upload CSV</a>
        </div>
      </div>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Student Directory</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>QR Code</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for student in students %}
              <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.course_name }}</td>
                <td><code class="text-muted small">{{ student.qr_data }}</code></td>
                <td>
                  <a href="/students/{{ student.id }}/edit" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                  <form method="post" action="/students/{{ student.id }}/delete" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</button>
                  </form>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
