{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Create Course</h5>
      </div>
      <div class="card-body">
        <form method="post" action="/courses">
          <div class="mb-3">
            <label for="name" class="form-label">Course Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Add Course</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Your Courses</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for course in courses %}
              <tr>
                <td>{{ course.name }}</td>
                <td>{{ course.description or '—' }}</td>
                <td>
                  <a href="/courses/{{ course.id }}/edit" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                  <form method="post" action="/courses/{{ course.id }}/delete" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</button>
                  </form>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
