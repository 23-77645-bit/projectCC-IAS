{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Edit Student</h5>
      </div>
      <div class="card-body">
        <form method="post" action="/students/{{ student.id }}/edit">
          <div class="mb-3">
            <label for="name" class="form-label">Student Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
          </div>
          <div class="mb-3">
            <label for="year_level" class="form-label">Year Level</label>
            <input type="text" class="form-control" id="year_level" name="year_level" value="{{ student.year_level }}">
          </div>
          <div class="mb-3">
            <label for="course_id" class="form-label">Course</label>
            <select class="form-select" id="course_id" name="course_id" required>
              {% for course in courses %}
              <option value="{{ course.id }}" {% if course.id == student.course_id %}selected{% endif %}>{{ course.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="/students" class="btn btn-secondary">Back to Students</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
