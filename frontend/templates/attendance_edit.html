{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Edit Attendance</h5>
      </div>
      <div class="card-body">
        <form method="post" action="/attendance/{{ record.id }}/edit">
          <div class="mb-3">
            <label class="form-label">Student</label>
            <input type="text" class="form-control" value="{{ record.student_name }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Course</label>
            <input type="text" class="form-control" value="{{ record.course_name }}" disabled>
          </div>
          <div class="mb-3">
            <label for="time_out" class="form-label">Time Out</label>
            <input type="datetime-local" class="form-control" id="time_out" name="time_out" value="{{ record.time_out|replace(' ', 'T') if record.time_out else '' }}">
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
              <option value="present" {% if record.status == 'present' %}selected{% endif %}>Present</option>
              <option value="absent" {% if record.status == 'absent' %}selected{% endif %}>Absent</option>
              <option value="late" {% if record.status == 'late' %}selected{% endif %}>Late</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Update Attendance</button>
            <a href="/attendance" class="btn btn-secondary">Back to Attendance</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
