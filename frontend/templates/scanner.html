{% extends 'base.html' %}
{% block title %}Live QR Scanner{% endblock %}
{% block content %}
<div class="row">
    <div class="col-12 mb-4">
        <h2 class="fw-bold mb-1">Live QR Scanner</h2>
        <p class="text-muted">Point the camera at a student's QR code to record attendance</p>
    </div>
</div>
<div class="row">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-3">
                <div id="qr-reader" style="width: 100%;"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header bg-white border-bottom">
                <h6 class="fw-bold mb-0">Student Information</h6>
            </div>
            <div class="card-body">
                <div id="scan-result">
                    <p class="text-muted text-center py-4">Waiting for scan...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.11/minified/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
{% endblock %}
