apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-db
  namespace: attendance-system
  labels:
    app: attendance-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance-db
  template:
    metadata:
      labels:
        app: attendance-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
              protocol: TCP
          envFrom:
            - configMapRef:
                name: attendance-config
            - secretRef:
                name: attendance-secret
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: MYSQL_HOST
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
              readOnly: true
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: attendance-db-pvc
        - name: init-sql
          configMap:
            name: db-init-schema
            defaultMode: 0644
